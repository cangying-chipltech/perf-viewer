[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perf-viewer"
version = "0.1.0"
description = "推理压测结果汇总呈现服务：模型 → 场景 → 配置集 → 节点×运行 → case"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "nh3>=0.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
perf-viewer = "app.cli:main"
perf-viewer-import = "app.import_config:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]